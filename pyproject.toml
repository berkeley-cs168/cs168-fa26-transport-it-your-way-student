[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transportlab"
version = "0.1.0"
description = "CS168 Transport project harness: scenarios, workloads, and measurement"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# Plots and schema checks. Optional: without matplotlib a run skips plots.png.
report = ["matplotlib>=3.6"]
dev = ["pytest>=8.0", "jsonschema>=4.0", "matplotlib>=3.6"]

[project.scripts]
transportlab = "transportlab.cli:main"

[tool.setuptools]
packages = ["transportlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
